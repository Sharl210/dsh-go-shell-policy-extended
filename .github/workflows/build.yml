name: Build Android module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Locate and install SDK platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-33' 'build-tools;33.0.2' || [ "$?" -eq 141 ]
      - name: Test and build
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect and stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DSHGoShellPolicy-debug.apk
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs dist/DSHGoShellPolicy-debug.apk | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging dist/DSHGoShellPolicy-debug.apk > dist/package.txt
          cd dist
          sha256sum DSHGoShellPolicy-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DSHGoShellPolicy-debug
          path: dist/*
